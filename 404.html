<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Umar Rahi</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23000'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23c0392b'>UR</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f5f0eb;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(192,57,43,0.12) 0%, transparent 65%);
      pointer-events: none;
    }

    .err__bg {
      position: absolute;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(14rem, 40vw, 28rem);
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 1px rgba(192,57,43,0.12);
      letter-spacing: -0.04em;
      pointer-events: none;
      user-select: none;
      line-height: 1;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    .err__content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .err__logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #c0392b;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .err__code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 900;
      line-height: 1;
      color: #f5f0eb;
      letter-spacing: -0.03em;
    }

    .err__code span { color: #c0392b; }

    .err__line {
      width: 60px;
      height: 1px;
      background: #c0392b;
    }

    .err__title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245,240,235,0.6);
    }

    .err__desc {
      font-size: 0.9rem;
      line-height: 1.7;
      color: rgba(245,240,235,0.45);
      max-width: 360px;
    }

    .err__btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 14px 32px;
      background: #c0392b;
      color: #fff;
      border: 1px solid #c0392b;
      border-radius: 3px;
      text-decoration: none;
      margin-top: 12px;
      transition: background 0.2s, transform 0.2s;
    }

    .err__btn:hover { background: #a93226; transform: translateY(-2px); }

    .err__footer {
      position: absolute;
      bottom: 24px;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245,240,235,0.25);
    }
  </style>
</head>
<body>
  <div class="err__bg" aria-hidden="true">404</div>

  <div class="err__content">
    <div class="err__logo">UR</div>
    <p class="err__code">4<span>0</span>4</p>
    <div class="err__line"></div>
    <p class="err__title">Page Not Found</p>
    <p class="err__desc">The page you're looking for doesn't exist or has been moved. Let's get you back to something real.</p>
    <a href="/" class="err__btn">← Back to Home</a>
  </div>

  <p class="err__footer">© 2026 Umar Rahi — Data Scientist</p>
</body>
</html>
